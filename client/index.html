<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OOP Strategy</title>
    <link rel="stylesheet" href="./main.css">
    <script src="./src/main.ts" type="module" defer></script>
</head>
<body>
  <main>
    <div id="control">
      <div class="new-game-container">
        <form id="new-game-form">
          <input placeholder="map seed" id="map-seed" name="map-seed" type="number">
          <input placeholder="players amount" id="players-amount" name="players-amount" type="number" min="2" max="8">
          <div class="new-game-map-size">
            <input name="width" placeholder="w" type="number" min="5" max="20">
            x
            <input name="height" placeholder="h" type="number" min="5" max="20">
          </div>
          <button id="new-game-btn" type="submit">New Game</button>
        </form>
      </div>
      <button id="end-turn-btn" disabled>End Turn</button>
    </div>
    <div id="status"></div>
    <div class="map-and-info-container">
      <div id="info">
        <div class="info-data"></div>
      </div>
      
      <div class="map-container">
        <div class="win-title">Red has won</div>
        <canvas id="map"></canvas>
      </div>
    </div>
  </main>
</body>
</html>
